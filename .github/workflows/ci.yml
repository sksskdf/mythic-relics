# 올릴 때마다 빌드(데이터 검사 포함)·단위 테스트·브라우저 스모크·봇 검증을 돌린다.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 테스트에는 Electron 실행 파일이 필요 없다.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # 러너에 깔려 있는 크롬을 쓴다. (WebGL은 스크립트의 swiftshader 옵션으로 소프트웨어 렌더링)
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사 + 빌드 + 단위 테스트 + 스모크
        run: npm run check
      - name: 봇 검증 (1판, 25분 안에 승급)
        run: node scripts/playtest.mjs 1 25 --gate
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
