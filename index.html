<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 휴대폰: 두 손가락 확대·두 번 눌러 확대를 막아 누르기가 바로 이동·공격이 되게 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>MYTHIC RELICS (프로토타입)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; overscroll-behavior: none; }
      #app { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* 아이폰 사파리는 user-scalable=no를 무시해서, 두 번 눌러 확대는 모든 요소의 touch-action으로 막는다 (창·대화 상자·HUD 단추 위에서도) */
      html, body, #app, #app * { touch-action: manipulation; }
      canvas { display: block; width: 100%; height: 100%; }
      /* 게임 화면은 손가락 몸짓(조이스틱·두 손가락 확대)을 게임이 직접 받는다 */
      #app canvas { touch-action: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
