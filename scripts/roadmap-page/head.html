<title>Mythic Relics 로드맵</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Silkscreen&display=swap">
<style>
/* 레이아웃: 위에서 아래로 한 줄기 — 단계 띠 → 지금 할 일 → E1~E10 길 → 이후 단계 → 표들. 설원의 룬스톤처럼 차가운 바탕에 룬 파랑, 게이트는 금빛 */
:root {
  --bg: #eef2f6;
  --panel: #ffffff;
  --sunk: #e3e9ef;
  --fg: #1b2430;
  --muted: #5d6b7c;
  --line: #cfd8e2;
  --rune: #1f6fa6;
  --rune-soft: #d6e8f4;
  --gold: #9a6d12;
  --gold-soft: #f3e6c4;
  --done: #2f7d4f;
  --done-soft: #d8eedf;
  --warn: #b0452f;
  --warn-soft: #f6dcd5;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-pixel: 'Silkscreen', 'IBM Plex Mono', ui-monospace, monospace;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --panel: #161d27; --sunk: #1c2531; --fg: #e3e9f0; --muted: #93a2b4; --line: #2a3544;
    --rune: #7fd4ff; --rune-soft: #17324a; --gold: #e3b341; --gold-soft: #3a2f14;
    --done: #6fd19a; --done-soft: #173527; --warn: #ff8f78; --warn-soft: #43201a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #161d27; --sunk: #1c2531; --fg: #e3e9f0; --muted: #93a2b4; --line: #2a3544;
  --rune: #7fd4ff; --rune-soft: #17324a; --gold: #e3b341; --gold-soft: #3a2f14;
  --done: #6fd19a; --done-soft: #173527; --warn: #ff8f78; --warn-soft: #43201a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.3; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: 0.9em; background: var(--sunk); padding: 1px 5px; border-radius: 3px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--rune); }
.eyebrow .pix, .pixl { font-family: var(--font-pixel); font-weight: 400; letter-spacing: 0.08em; }
.muted { color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 16px; }

/* 머리 */
header.top { padding-top: 40px; display: flex; flex-direction: column; gap: 10px; }
header.top h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 700; letter-spacing: -0.01em; }
header.top h1 .pix { font-family: var(--font-pixel); font-weight: 400; color: var(--rune); letter-spacing: 0.02em; }
header.top .lede { max-width: 65ch; color: var(--muted); }

/* 단계 띠 */
.band { display: flex; width: 100%; min-height: 76px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.band .seg { position: relative; padding: 10px 10px 8px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.band .seg:last-child { border-right: none; }
.band .seg .n { font-family: var(--font-pixel); font-size: 11px; color: var(--muted); }
.band .seg .t { font-weight: 700; font-size: 13px; line-height: 1.3; overflow-wrap: anywhere; }
.band .seg .w { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.band .seg.done { background: var(--done-soft); }
.band .seg.now { background: var(--rune-soft); }
.band .seg .nowtag { font-size: 11px; font-weight: 700; color: var(--rune); }
.band .seg .gk { margin-top: auto; padding-top: 6px; font-size: 12px; font-weight: 700; color: var(--gold); }
.band-note { font-size: 13px; color: var(--muted); }
@media (max-width: 720px) {
  .band { flex-direction: column; }
  .band .seg { border-right: none; border-bottom: 1px solid var(--line); flex: none !important; }
}

/* 지금 할 일 */
.now { margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; counter-reset: step; }
.now li { list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex; gap: 12px; }
.now li::before { counter-increment: step; content: counter(step); font-family: var(--font-pixel); color: var(--rune); font-size: 18px; line-height: 1.2; }

/* 도구 줄 */
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
.toolbar input[type="search"] { flex: 1 1 220px; min-width: 0; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-family: var(--font-mono); font-size: 12px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--rune); border-color: var(--rune); color: var(--bg); }
.chip:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--rune); outline-offset: 2px; }
.nav { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.nav a { color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--rune); }

/* E 길 */
.path { display: flex; flex-direction: column; gap: 0; position: relative; }
.ms { position: relative; padding-left: 52px; padding-bottom: 14px; }
.ms::before { content: ""; position: absolute; left: 19px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.ms:last-child::before { bottom: auto; height: 24px; }
.ms .node { position: absolute; left: 4px; top: 10px; width: 32px; height: 32px; border-radius: 4px; background: var(--panel); border: 2px solid var(--rune); display: grid; place-items: center; font-family: var(--font-pixel); font-size: 11px; color: var(--rune); }
.ms details { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.ms summary { cursor: pointer; list-style: none; padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.ms summary::-webkit-details-marker { display: none; }
.ms summary .name { font-weight: 700; font-size: 16px; }
.ms summary .wk { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ms summary .feel { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
.ms summary .prog { grid-column: 1 / -1; font-size: 12px; color: var(--done); }
.ms details[open] summary { border-bottom: 1px solid var(--line); }
.ms .body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; }
.kv dt { font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 2px; }
.kv dd { margin: 0; min-width: 0; }
.verify { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 720px) { .verify { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; } }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
.box h4 { margin: 0 0 8px; font-size: 13px; }
.box ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.box.check ul { list-style: none; padding-left: 0; }
.box.check label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.box.check input { margin-top: 4px; accent-color: var(--done); }
.box.check .note { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
.donebar { background: var(--gold-soft); border-left: 3px solid var(--gold); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 14px; }
.donebar b:first-child { color: var(--gold); margin-right: 6px; }
.gate { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 6px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.gate .gt { font-weight: 700; color: var(--gold); }
.gate ul { margin: 0; padding-left: 18px; font-size: 14px; }

/* 표 */
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 700; background: var(--sunk); white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.id { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; color: var(--rune); }
td.trk span { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
td.size { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
tr.hide { display: none; }
.empty { padding: 10px; font-size: 13px; color: var(--muted); }

.stage { display: flex; flex-direction: column; gap: 12px; }
.stage > details { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.stage > details > summary { cursor: pointer; padding: 12px 16px; font-weight: 700; }
.stage > details > .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.lv-h { color: var(--warn); font-weight: 700; }
footer { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .ms details[open] .body { animation: open 0.18s ease-out; } }
@keyframes open { from { opacity: 0.4; } to { opacity: 1; } }

/* v2.0: 끝난 작업 줄, 끝난·진행 중 마일스톤, 진행 기록 */
tr.done td { color: var(--muted); }
tr.done td.id::after { content: " ✓"; color: var(--done); }
.ms.done .node { border-color: var(--done); color: var(--done); background: var(--done-soft); }
.ms.now .node { background: var(--rune); color: var(--bg); }
.ms.now summary .name::after { content: "진행 중"; margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--rune); border: 1px solid var(--rune); border-radius: 999px; padding: 0 6px; vertical-align: 2px; }
.box.log ul { gap: 6px; }
.box.log { background: var(--sunk); }
.status-done { color: var(--done); font-weight: 700; }
.status-now { color: var(--rune); font-weight: 700; }
.lead-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 75ch; }
</style>
